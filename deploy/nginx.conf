# High Court Clerk CPT — nginx site config for a Hostinger KVM VPS (Ubuntu).
# Serves the prerendered SPA from client/dist and proxies /api to PM2 on
# 127.0.0.1:4000. Place at /etc/nginx/sites-available/highcourtclerkcpt and
# symlink into sites-enabled; certbot rewrites the TLS bits.

server {
    listen 80;
    server_name highcourtclerkcpt.in www.highcourtclerkcpt.in;
    # certbot will add the 443 server block and redirect 80 -> 443.

    root /var/www/high-court-clerk-cpt/client/dist;
    index index.html;

    # --- security headers (the SPA's CSP; allows Google Fonts + Razorpay) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # --- gzip ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # --- API proxy to the Node/PM2 process ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- hashed build assets: cache hard ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- static files, prerendered HTML, then SPA fallback ---
    # This is the line that makes public routes return real HTML with JS off:
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # sitemap/robots/llms served directly
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }
}
